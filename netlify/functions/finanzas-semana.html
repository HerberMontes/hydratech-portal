<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanzas · Semana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/hydratech-icon.png">
<meta name="theme-color" content="#1b2447">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--blue:#263370;--deep:#1b2447;--ink:#1b2138;--body:#4a5267;--muted:#717a90;
    --line:#e6e9f0;--soft:#f7f9fc;--green:#16a34a;--green-d:#14803d;--green-bg:#eefaf1;--green-bd:#b6e2c3;
    --red:#e5484d;--red-d:#b93338;--red-bg:#fdeff0;--red-bd:#f3c2c4;
    --gold:#c9a14a;--gold-d:#8a6d2c;--gold-bg:#fdf6e6;--gold-bd:#ecdcb4}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--body);background:var(--soft);-webkit-font-smoothing:antialiased}
  .hoja{max-width:1080px;margin:0 auto;padding:38px 28px 70px}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .arch{font-family:'Archivo',sans-serif}
  h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;color:var(--ink);margin-bottom:14px}

  .cab{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .cab h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:42px;line-height:1;color:var(--ink);letter-spacing:-.02em}
  .badge{display:inline-block;padding:5px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
  .b-curso{background:var(--blue);color:#fff} .b-cerr{background:#eef0f5;color:var(--muted)}
  .cab-der{text-align:right}
  .cab-der .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:29px;color:var(--deep);margin-top:6px}

  .sem{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px}
  .card{border-radius:14px;padding:24px 26px}
  .card .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
  .card .big{font-family:'Archivo',sans-serif;font-weight:900;font-size:52px;line-height:1.02;color:var(--ink);letter-spacing:-.03em;margin:12px 0 5px}
  .card .sub{font-size:14.5px;color:var(--body)}
  .barra{position:relative;margin-top:20px;height:12px;border-radius:6px;background:#fff}
  .barra .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
  .barra .marca{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--deep);border-radius:2px}
  .esc{display:flex;justify-content:space-between;margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:var(--muted)}
  .pie-c{font-size:12.5px;color:var(--muted);margin-top:11px;padding-top:11px;border-top:1px solid rgba(0,0,0,.07)}

  .ritmo{display:flex;gap:14px;align-items:flex-start;border-radius:12px;padding:18px 22px;margin-top:20px;border:1px solid;border-left-width:4px}
  .ritmo .dot{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;border:3px solid;background:#fff}
  .ritmo .txt{font-size:16.5px;line-height:1.5;color:var(--ink);max-width:64ch}

  .dias{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .dia{border-radius:12px;padding:16px 14px;background:#f2f4f8;border:1px solid var(--line)}
  .dia.hoy{border:2px solid var(--blue);background:#fff}
  .dia.fut{background:#fff;border:1px dashed #cfd5e2;opacity:.5}
  .dia .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;color:var(--ink);margin-top:10px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:24px}
  .panel .top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 20px;cursor:pointer}
  .panel .top:hover{background:var(--soft)}
  .panel .cuerpo{border-top:1px solid var(--line);padding:6px 20px 20px}

  .semanas{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto}
  .semanas .s{flex:1;min-width:80px;text-align:center;padding:11px 6px;border-radius:8px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--soft);color:var(--body)}
  .semanas .s.on{background:var(--blue);color:#fff}
  .semanas .s .m{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;margin-top:5px}

  .cart{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .cart .c{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .cart .c .n{font-family:'Archivo',sans-serif;font-weight:800;font-size:32px;color:var(--ink);margin-top:10px;letter-spacing:-.02em}

  table{width:100%;border-collapse:collapse;font-size:14px}
  thead tr{background:var(--deep)}
  th{text-align:left;padding:13px 18px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;font-weight:500}
  td{padding:14px 18px;border-bottom:1px solid var(--line)}
  .tw{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tag{display:inline-block;padding:4px 9px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  .t-ok{background:var(--green-bg);color:var(--green-d)} .t-pen{background:#f2f4f8;color:var(--muted)} .t-can{background:var(--red-bg);color:var(--red-d)}

  input{font-family:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;color:var(--ink);background:var(--soft)}
  .cfg{display:grid;grid-template-columns:repeat(3,minmax(0,200px));gap:18px;margin-top:16px}
  .btn{font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 18px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--body)}
  .btn.prim{background:var(--deep);border-color:var(--deep);color:#fff}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}
  .vacio{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:13.5px}

  @media(max-width:780px){.sem,.cart{grid-template-columns:1fr}.cab{flex-direction:column;align-items:flex-start;gap:16px}.cab-der{text-align:left}
    .dias{display:flex;overflow-x:auto}.dias>div{min-width:112px;flex:none}.cfg{grid-template-columns:1fr}.tw{overflow-x:auto}.cab h1{font-size:32px}}
  @media print{body{background:#fff}.hoja{padding:0;max-width:none}.no-print{display:none!important}
    .card,.panel,.cart .c,.tw{break-inside:avoid}@page{margin:12mm}}
</style>
<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script defer src="auth-gate.js"></script>
</head>
<body>
<div class="hoja">
  <div class="mono">Finanzas · Semana</div>
  <div id="app" style="margin-top:10px"><div class="vacio">Cargando…</div></div>

  <div class="acts no-print">
    <button class="btn prim" onclick="window.print()">Guardar como PDF</button>
    <a class="btn" href="acceso.html" style="text-decoration:none">Volver al portal</a>
    <button class="btn" onclick="cargar()">Actualizar</button>
  </div>
</div>

<script>
const API="/api/finanzas-semana";
let D=null, sel=null, verAjustes=false, verCfg=false;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mxn=n=>{n=Number(n)||0;const s=n<0?"-":"";n=Math.abs(n);
  if(n>=1e6)return s+"$"+(n/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1e3)return s+"$"+Math.round(n/1e3)+"K";return s+"$"+Math.round(n);};
const full=n=>"$"+Math.round(Number(n)||0).toLocaleString("es-MX");
const MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAN=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const fLarga=f=>{const d=new Date(f+"T12:00:00Z");return d.getUTCDate()+" de "+MES[d.getUTCMonth()];};
const fCorta=f=>{const d=new Date(f+"T12:00:00Z");return d.getUTCDate()+" "+MES[d.getUTCMonth()].slice(0,3);};

/* Semáforo: verde 100%+, oro 80-99%, rojo abajo de 80% */
function tono(r){
  if(r>=1)   return {l:"var(--green)",d:"var(--green-d)",bg:"var(--green-bg)",bd:"var(--green-bd)"};
  if(r>=0.8) return {l:"var(--gold)", d:"var(--gold-d)", bg:"var(--gold-bg)", bd:"var(--gold-bd)"};
  return       {l:"var(--red)",   d:"var(--red-d)",   bg:"var(--red-bg)",   bd:"var(--red-bd)"};
}

function tarjeta(titulo,nota,valor,base,metaTotal,enCurso){
  const r=base>0?valor/base:0, t=tono(r);
  const pct=base>0?Math.round(r*100):0;
  const anchoFill=metaTotal>0?Math.min(100,(valor/metaTotal)*100):0;
  const anchoMarca=(metaTotal>0&&enCurso)?Math.min(100,(base/metaTotal)*100):null;
  const dif=valor-base;
  return '<div class="card" style="background:'+t.bg+';border:1px solid '+t.l+'">'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">'
    +'<span class="lbl" style="color:'+t.l+'">'+esc(titulo)+'</span>'
    +'<span class="mono" style="font-size:10.5px;letter-spacing:.08em">'+esc(nota)+'</span></div>'
    +'<div class="big">'+mxn(valor)+'</div>'
    +'<div class="sub">'+pct+'% de la meta '+(enCurso?"al día":"semanal")
      +' · <span style="color:'+t.l+';font-weight:600">'+mxn(Math.abs(dif))+(dif>=0?" arriba":" abajo")+'</span></div>'
    +'<div class="barra"><div class="fill" style="width:'+anchoFill+'%;background:'+t.l+'"></div>'
      +(anchoMarca!=null?'<div class="marca" style="left:'+anchoMarca+'%"></div>':'')+'</div>'
    +'<div class="esc"><span>0</span><span>META SEMANAL '+full(metaTotal)+'</span></div>'
    +'<div class="pie-c">'+(enCurso?"La marca es dónde deberías ir hoy":"Cifra al cierre de la semana")+'</div></div>';
}

function franjaRitmo(){
  const p=D.proyeccion, meta=D.meta, s=semanaSel();
  let col,txt;
  if(s.vendido>=meta&&meta>0){col={l:"var(--green)",bg:"var(--green-bg)",bd:"var(--green-bd)",d:"var(--green-d)"};
    txt="Ya cruzaste el punto de equilibrio. Lo de aquí en adelante es utilidad.";}
  else if(p==null){col={l:"var(--muted)",bg:"#f2f4f8",bd:"var(--line)",d:"var(--muted)"};
    txt="Es muy pronto para proyectar. Vuelve mañana.";}
  else if(p>=meta){col={l:"var(--blue)",bg:"#eef1fa",bd:"#c6cee8",d:"var(--blue)"};
    txt="A este ritmo cierras en <strong class='arch' style='font-weight:800'>"+full(p)+"</strong>. Alcanzas el punto de equilibrio antes del cierre.";}
  else{col={l:"var(--red)",bg:"var(--red-bg)",bd:"var(--red-bd)",d:"var(--red-d)"};
    txt="A este ritmo cierras en <strong class='arch' style='font-weight:800'>"+full(p)+"</strong>. No alcanzas el equilibrio esta semana.";}
  return '<div class="ritmo" style="background:'+col.bg+';border-color:'+col.bd+';border-left-color:'+col.l+'">'
    +'<div class="dot" style="border-color:'+col.l+'"></div><div>'
    +'<div class="mono" style="font-size:10.5px;color:'+col.d+';margin-bottom:6px">Ritmo</div>'
    +'<div class="txt">'+txt+'</div></div></div>';
}

const semanaSel=()=>(D.semanas||[]).find(s=>s.clave===sel)||{vendido:0,cobrado:0,ajustes:0,ordenes:[],detalleAjustes:[]};

function pintar(){
  const s=semanaSel(), enCurso=sel===D.semanaActual;
  const meta=D.meta||0, base=enCurso?(D.metaAlDia||0):meta;
  let h="";

  /* Encabezado */
  h+='<div class="cab"><div>'
    +'<div style="display:flex;align-items:center;gap:12px">'
    +'<h1>Semana '+(s.numero||"—")+'</h1>'
    +'<span class="badge '+(enCurso?"b-curso":"b-cerr")+'">'+(enCurso?"En curso":"Cerrada")+'</span></div>'
    +'<div style="font-size:14.5px;color:var(--muted);margin-top:8px">'
    +(enCurso
      ? DIAN[(D.diasCorridos||1)-1]+" "+fLarga(D.hoy)+" · día "+D.diasCorridos+" de "+D.diasHabiles
      : (s.lunes?fCorta(s.lunes)+" al "+fLarga(s.domingo):"—")+" · semana cerrada")
    +'</div></div>'
    +'<div class="cab-der"><div class="mono">'+(enCurso?"Meta al día de hoy":"Meta semanal")+'</div>'
    +'<div class="n">'+full(base)+'</div>'
    +'<div style="font-size:12.5px;color:var(--muted);margin-top:3px">'
    +(enCurso?"de "+full(meta)+" semanal":D.diasHabiles+" días hábiles")+'</div></div></div>';

  if(!meta){
    h+='<div class="vacio" style="margin-top:24px">Falta capturar los costos fijos y el margen bruto para calcular el punto de equilibrio. Ábrelo abajo, en Parámetros.</div>';
  }

  /* Semáforos */
  h+='<div class="sem">'
    +tarjeta("Vendido","Órdenes confirmadas",s.vendido,base,meta,enCurso)
    +tarjeta("Cobrado","Pagos registrados",s.cobrado,base,meta,enCurso)+'</div>';

  if(enCurso&&meta) h+=franjaRitmo();

  /* Día por día */
  if(enCurso&&(D.dias||[]).length){
    h+='<div style="margin-top:30px"><h2>Día por día</h2><div class="dias">';
    D.dias.forEach((d,i)=>{
      const cls=d.esHoy?"dia hoy":(d.transcurrido?"dia":"dia fut");
      h+='<div class="'+cls+'"><div class="mono" style="font-size:10.5px">'+DIAN[i]+'</div>'
        +'<div class="n">'+(d.transcurrido?mxn(d.monto):"—")+'</div>'
        +'<div class="mono" style="font-size:10px;color:var(--blue);margin-top:6px;min-height:12px">'+(d.esHoy?"Hoy":"")+'</div></div>';
    });
    h+='</div></div>';
  }

  /* Ajustes */
  const aj=s.detalleAjustes||[];
  h+='<div class="panel"><div class="top" onclick="verAjustes=!verAjustes;pintar()">'
    +'<span class="mono">Ajustes de semanas anteriores</span>'
    +'<span style="display:flex;align-items:center;gap:14px">'
    +'<span class="arch" style="font-weight:800;font-size:17px;color:'+(s.ajustes<0?"var(--red)":"var(--body)")+'">'+(aj.length?mxn(s.ajustes):"Sin ajustes")+'</span>'
    +'<span style="font-size:13px;color:var(--blue);text-decoration:underline">'+(verAjustes?"Ocultar":"Ver "+aj.length)+'</span></span></div>';
  if(verAjustes){
    h+='<div class="cuerpo">';
    if(!aj.length) h+='<div style="font-size:13.5px;color:var(--muted);padding:10px 0">Ningún monto cambió desde que se registró.</div>';
    else{
      h+='<div class="tw" style="border:0"><table><thead><tr><th>Folio</th><th>Semana</th><th style="text-align:right">Antes</th><th style="text-align:right">Ahora</th><th>Motivo</th></tr></thead><tbody>';
      aj.forEach(a=>{h+='<tr><td class="mono" style="font-size:12px;color:var(--blue);text-transform:none;letter-spacing:0">'+esc(a.folio)+'</td>'
        +'<td>Semana '+a.semana+'</td>'
        +'<td style="text-align:right;color:var(--muted)" class="arch">'+full(a.montoAnterior)+'</td>'
        +'<td style="text-align:right" class="arch">'+full(a.montoNuevo)+'</td>'
        +'<td>'+esc(a.motivo)+'</td></tr>';});
      h+='</tbody></table></div>';
    }
    h+='<div style="font-size:12.5px;color:var(--muted);margin-top:12px">La venta no se duplica: cada orden conserva su semana original. Solo cambia su monto.</div></div>';
  }
  h+='</div>';

  /* Selector de semanas */
  h+='<div class="no-print" style="margin-top:28px"><div class="mono" style="margin-bottom:10px">Semanas</div><div class="semanas">';
  (D.semanas||[]).slice(0,8).reverse().forEach(w=>{
    h+='<div class="s'+(w.clave===sel?" on":"")+'" onclick="sel=\''+w.clave+'\';pintar()">'
      +'<div>S'+w.numero+'</div><div class="m">'+mxn(w.vendido)+'</div></div>';
  });
  h+='</div></div>';

  /* Cartera */
  const c=D.cartera||{};
  h+='<div style="margin-top:30px"><h2>Cartera</h2><div class="cart">'
    +'<div class="c"><div class="mono">Por vencer</div><div class="n">'+mxn(c.porVencer)+'</div><div style="font-size:12.5px;color:var(--muted);margin-top:5px">'+full(c.porVencer)+'</div></div>'
    +'<div class="c"><div class="mono">Vencida</div><div class="n" style="color:var(--red)">'+mxn(c.vencida)+'</div><div style="font-size:12.5px;color:var(--muted);margin-top:5px">'+full(c.vencida)+'</div></div>'
    +'<div class="c"><div class="mono">Días de cartera</div><div class="n">'+(c.dias||0)+'</div><div style="font-size:12.5px;color:var(--muted);margin-top:5px">Promedio de cobro</div></div>'
    +'</div></div>';

  /* Detalle */
  h+='<div style="margin-top:30px"><h2>Detalle de la semana</h2><div class="tw"><table>'
    +'<thead><tr><th>Folio</th><th>Cliente</th><th>Fecha</th><th style="text-align:right">Monto</th><th>Estado</th></tr></thead><tbody>';
  const ords=(s.ordenes||[]).slice().sort((a,b)=>b.monto-a.monto);
  if(!ords.length) h+='<tr><td colspan="5" style="color:var(--muted)">Sin órdenes confirmadas en esta semana.</td></tr>';
  ords.forEach(o=>{
    const tg=o.estado==="cobrado"?'<span class="tag t-ok">Cobrado</span>'
      :o.estado==="cancelada"?'<span class="tag t-can">Cancelada</span>'
      :'<span class="tag t-pen">Por cobrar</span>';
    h+='<tr><td class="mono" style="font-size:12px;color:var(--blue);text-transform:none;letter-spacing:0">'+esc(o.folio)+'</td>'
      +'<td style="color:var(--ink);font-weight:500">'+esc(o.cliente||"—")+'</td>'
      +'<td style="color:var(--muted)">'+fCorta(o.fecha)+'</td>'
      +'<td style="text-align:right" class="arch">'+full(o.monto)+'</td><td>'+tg+'</td></tr>';
  });
  h+='<tr><td colspan="3" class="mono">Total de la semana</td>'
    +'<td style="text-align:right" class="arch" style="font-weight:900">'+full(s.vendido)+'</td>'
    +'<td style="font-size:13px;color:var(--muted)">Cobrado '+full(s.cobrado)+'</td></tr>';
  h+='</tbody></table></div>'
    +'<div style="font-size:12.5px;color:var(--muted);margin-top:11px">Las semanas se cortan por la fecha en que la orden se confirmó por primera vez. Esa fecha se congela y no cambia aunque la orden se edite después. Solo cuentan órdenes confirmadas; las cotizaciones no.</div></div>';

  /* Parámetros */
  const p=D.parametros||{};
  h+='<div class="panel no-print"><div class="top" onclick="verCfg=!verCfg;pintar()">'
    +'<span class="mono">Parámetros del punto de equilibrio</span>'
    +'<span class="mono" style="letter-spacing:0">'+(verCfg?"cerrar —":"abrir +")+'</span></div>';
  if(verCfg){
    h+='<div class="cuerpo"><div class="cfg">'
      +'<label><span class="mono" style="display:block;margin-bottom:7px">Costos fijos mensuales</span><input id="p-cf" type="number" value="'+(p.costosFijos||0)+'"></label>'
      +'<label><span class="mono" style="display:block;margin-bottom:7px">Margen bruto (%)</span><input id="p-mg" type="number" value="'+(p.margen||0)+'"></label>'
      +'<label><span class="mono" style="display:block;margin-bottom:7px">Días hábiles por semana</span><input id="p-dh" type="number" value="'+(p.diasHabiles||6)+'"></label></div>'
      +'<div class="mono" style="margin-top:16px;letter-spacing:0;text-transform:none;font-size:11.5px;line-height:1.75">'
      +'Punto de equilibrio mensual = costos fijos ÷ margen bruto<br>meta semanal = mensual ÷ 4.33<br>meta al día = semanal × (días transcurridos ÷ días hábiles)'
      +(meta?'<br><span style="color:var(--blue)">'+full(meta*4.33)+' ÷ 4.33 = '+full(meta)+' semanal · meta al día '+full(D.metaAlDia)+'</span>':'')
      +'</div><div class="acts" style="margin-top:16px"><button class="btn prim" onclick="guardar()">Guardar parámetros</button></div></div>';
  }
  h+='</div>';

  h+='<div class="mono" style="margin-top:26px">HydraTech Group · datos en vivo desde Odoo · zona '+esc(D.tz||"")+'</div>';
  document.getElementById("app").innerHTML=h;
}

async function guardar(){
  const b={costosFijos:Number(document.getElementById("p-cf").value)||0,
           margen:Number(document.getElementById("p-mg").value)||0,
           diasHabiles:Number(document.getElementById("p-dh").value)||6};
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
    const d=await r.json(); if(!d||!d.ok) throw new Error((d&&d.error)||"No se pudo guardar.");
    await cargar();
  }catch(e){alert("No se pudo guardar: "+(e.message||e));}
}

async function cargar(){
  try{
    const r=await fetch(API);
    const d=await r.json();
    if(!d||!d.ok) throw new Error((d&&d.error)||"No se pudo leer.");
    D=d; if(!sel||!(D.semanas||[]).some(s=>s.clave===sel)) sel=D.semanaActual;
    pintar();
  }catch(e){
    document.getElementById("app").innerHTML='<div class="vacio">No se pudo cargar: '+esc(e.message||e)+'</div>';
  }
}
window.onAuthReady=function(){ cargar(); };
</script>
